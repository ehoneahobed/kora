name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Docs code blocks typecheck (DX-3)
        run: pnpm docs:check-code

      - name: Getting Started tutorial against a scaffolded app (DX-3)
        run: pnpm docs:check-tutorial

      - name: Benchmark gates
        # Gates within the runner's speed variance only warn on shared runners; the
        # benchmark-gates workflow enforces them head-vs-base on the same runner.
        env:
          KORA_BENCH_SHARED_RUNNER: '1'
        run: pnpm benchmark:gates

      - name: Test
        run: pnpm test

      - name: Release gate (production-path, reconnect, chaos)
        run: pnpm test:production-path && pnpm test:sync-reconnect && pnpm test:chaos:real-path

      - name: Typecheck
        run: pnpm typecheck
