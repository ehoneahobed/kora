name: remediation

# Enforces the remediation tracker (remediation/tracker.json) against the reproduction suites.
# A problem marked "fixed" whose repro tests fail, a broken guard, or an unmapped failing repro
# test fails this job. Open problems are expected to fail their repro tests and do not.
# See remediation/README.md.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KORA_PG_TEST_URL: postgres://postgres:kora@localhost:5432/postgres
      LMS_OPS: '20000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PostgreSQL 16 ships preinstalled (disabled) on ubuntu-24.04 runners. It used to be
      # a service container, but every pull of it from Amazon ECR Public (and before that
      # Docker Hub) is an anonymous pull, and the shared runner pool exhausts that quota:
      # "toomanyrequests: Data limit exceeded" failed the job in "Initialize containers"
      # before any check ran. The Postgres repro tests skip when KORA_PG_TEST_URL is unset,
      # so this step fails the job rather than letting them silently skip.
      - name: Start PostgreSQL (preinstalled on the runner)
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          pg_isready -h localhost -p 5432
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'kora';"
          psql "$KORA_PG_TEST_URL" -v ON_ERROR_STOP=1 -tAc 'SELECT version()'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter kora-e2e exec playwright install --with-deps chromium

      - name: Resolve Chromium path
        run: echo "PW_CHROMIUM_PATH=$(cd e2e && node -e "import('@playwright/test').then(m => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Run remediation checker (node, Postgres, real Chromium, type probes)
        run: node scripts/remediation/check.mjs --all

      - name: Publish status
        if: always()
        # When an earlier step fails, the checker never ran and wrote no status: say so
        # instead of failing a second time on a missing file.
        run: |
          if [ -f remediation/STATUS.md ]; then
            cat remediation/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Remediation checker did not run; see the failed step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-status
          path: remediation/STATUS.md
