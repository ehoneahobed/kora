name: tauri-plugin

# The Kora SQLite Tauri plugin's Rust checks: formatting and its unit and integration tests
# (path validation, the attached-database limit, binary values, deleting database files).
# Compiling the tauri crate takes minutes and needs webkit2gtk, so it runs when the plugin or
# this workflow changes, on pull requests and on main.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/tauri/plugin/**'
      - '.github/workflows/tauri-plugin.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/tauri/plugin/**'
      - '.github/workflows/tauri-plugin.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/tauri/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev pkg-config

      - name: Formatting
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked
